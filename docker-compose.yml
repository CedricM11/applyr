services:
  postgres:
    image: postgres:18
    container_name: applyr_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "15432:5432"

    volumes:
      - applyr_postgres_data:/var/lib/postgresql

volumes:
  applyr_postgres_data: